name: verification

# Ce qui doit rester vrai de ce depot, verifie a chaque poussee.
#
# Les trois invariants sont decrits dans scripts/validate.mjs, chacun ecrit le jour ou il a ete
# rompu. Aucun ne casse bruyamment quand il l'est : une skill hors format n'est simplement jamais
# reprise par l'un des agents, une adresse en dur n'authentifie personne et se lit comme un jeton
# invalide, et une commande publiee sur aucun registre repond 404 au premier client qui la tape.
# C'est exactement le genre de defaut qu'une verification automatique attrape et qu'une relecture
# laisse passer.

on:
  push:
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Le format des skills, l'absence d'adresse, l'absence de commande fantome
        run: node scripts/validate.mjs

      # La garantie produit : aucun verbe n'accepte de code, de diff ni de contenu de fichier.
      # La couche statique ne demande aucun reseau et se joue donc partout.
      - name: La conformite du contrat, couche statique
        run: node galy/contract/conformance/runner.mjs

      - name: Les scripts s'analysent
        run: |
          node --check setup/setup.mjs
          node --check galy/bin/bg.mjs
          node --check galy/bin/bug-evaluation-runner.mjs
          node --check scripts/validate.mjs
          # Les hooks par le motif, jamais par la liste : un hook ajoute sans etre ajoute ici
          # serait le seul script publie que rien ne lit avant un poste de client.
          for hook in galy/hooks/*.mjs galy/hooks/*/*.mjs; do node --check "$hook"; done
          for script in scripts/*.mjs; do node --check "$script"; done

      # Le mod qui dessine le panneau a cote de la conversation est du TypeScript execute
      # dans le processus de Claude Code, type contre les declarations que /plugin-types
      # ecrit (types/claude-code.d.ts, dont la premiere ligne nomme sa version). L'API est
      # en acces anticipe : elle peut bouger d'une version a l'autre, et la seule facon de
      # l'apprendre avant un poste de client est de recompiler a chaque poussee.
      - name: Le panneau compile contre les declarations versionnees
        run: npx -y -p typescript@5 tsc -p tsconfig.json

      # Ce que le panneau decide — l'arbre, les deux orthographes, le cache, la mise en
      # forme — vit dans des fonctions pures, parce que `claude plugin test` n'existe pas
      # dans la version installee et que le kit `claude-code/testing` est donc hors de
      # portee. Ces fonctions sont rejouees ici sur les reponses reelles des deux espaces.
      - name: Le panneau rejoue ses contrats sur les deux espaces de travail
        run: node scripts/check-where.mjs

      # La ligne sous le prompt et le hook qui l'alimente, rejoués ensemble sur un banc
      # d'essai en dossier temporaire : aucun réseau, aucune ligne de développeur touchée.
      # Ces contrats existaient sans être joués nulle part, donc sans rien garantir.
      - name: La ligne sous le prompt rejoue ses contrats
        run: npm run check:statusline

      # La projection Codex : chaque `${CLAUDE_PLUGIN_ROOT}/<chemin>` qu'une skill epelle doit
      # exister dans l'arbre que le generateur vient d'ecrire. Sans ce pas, une reference qui ne
      # resout rien sous Codex ne casse rien : l'onglet lit « ouvre ce fichier », ne trouve rien,
      # et continue sans les conventions pour lesquelles on l'y envoyait. C'est reste vrai pour
      # dix-huit references jusqu'au 21 septembre 2026, tous les controles au vert.
      #
      # `--verify` et non `--check` : la sortie est gitignoree, donc un checkout neuf n'en a
      # aucune et `--check` y lit chaque fichier comme une derive. `--check` est le controle du
      # developpeur, sur sa propre projection construite.
      - name: La projection Codex resout ce qu'elle epelle
        run: npm run verify:codex

      - name: Le bac bwrap est obligatoire pour les contrats d'isolation
        run: |
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version

      - name: Le runner bug-evaluation rejoue ses contrats
        env:
          GALY_BUG_EVALUATION_REQUIRE_SANDBOX: "1"
        run: |
          # Ubuntu's AppArmor user-namespace restriction blocks bwrap's loopback setup with
          # RTM_NEWADDR. This is an ephemeral GitHub VM: temporarily relax only that kernel
          # switch, keep the test as the normal checkout user, and restore the exact value even
          # when the test fails. File capabilities are deliberately not used because bwrap
          # rejects them unless installed setuid.
          apparmor_key=kernel.apparmor_restrict_unprivileged_userns
          if apparmor_value="$(sudo sysctl -n "$apparmor_key" 2>/dev/null)"; then
            echo "$apparmor_key before=$apparmor_value"
            sudo sysctl -w "$apparmor_key=0"
            trap 'sudo sysctl -w "$apparmor_key=$apparmor_value"' EXIT
          else
            echo "$apparmor_key is unavailable; continuing with the host sandbox policy"
          fi
          npm run test:bug-evaluation --prefix galy
